<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Signaler un bug — Me2/3Legend</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/landing.css">
</head>
<body>
  <nav class="landing-nav">
    <a href="/" class="nav-brand"><span class="nav-logo">2</span><span>Me<strong>2/3</strong>Legend</span></a>
    <div class="nav-actions"><a href="/login" class="btn ghost sm">Se connecter</a></div>
  </nav>
  <section class="section" style="padding-top:60px;max-width:800px;margin:0 auto;">
    <h1 class="section-title">Signaler un bug</h1>
    <div class="glass" style="padding:40px;">
      <p style="margin-bottom:20px;color:var(--txt-dim);">Décrivez le problème rencontré. Notre équipe technique vous répondra sous 24h.</p>
      <form id="bug-form">
        <div class="form-field"><label>Votre Email</label><input type="email" id="bug-email" required class="input"></div>
        <div class="form-field"><label>Sujet du bug</label><input type="text" id="bug-subject" required class="input"></div>
        <div class="form-field"><label>Description détaillée</label><textarea id="bug-message" required class="input" rows="4"></textarea></div>
        <button type="submit" class="btn" style="width:100%;">Envoyer le rapport</button>
      </form>
    </div>
  </section>
  <script>
    document.getElementById('bug-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const r = await fetch('/api/public/contact', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: 'Bug Reporter',
            email: document.getElementById('bug-email').value,
            subject: 'BUG : ' + document.getElementById('bug-subject').value,
            message: document.getElementById('bug-message').value
          })
        });
        if (r.ok) { alert('✅ Merci, votre rapport a été envoyé.'); e.target.reset(); }
      } catch (err) { alert('Erreur réseau'); }
    });
  </script>
</body>
</html>
